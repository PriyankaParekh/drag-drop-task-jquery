<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
    <script>
       $(function() {
            // Make items in .sortable draggable and connect them
            $(".sortable").sortable({
                connectWith: ".sortable",
            });

            // Load saved data from local storage
            loadSavedData();
        });

        // Function to save changes to local storage
        function saveChanges() {
            localStorage.setItem("div1", $("#div1").html());
            localStorage.setItem("div2", $("#div2").html());
            localStorage.setItem("div3", $("#div3").html());
        }

        // Function to load saved data from local storage
        function loadSavedData() {
            const div1Content = localStorage.getItem("div1");
            const div2Content = localStorage.getItem("div2");
            const div3Content = localStorage.getItem("div3");
            if (div1Content) $("#div1").html(div1Content);
            if (div2Content) $("#div2").html(div2Content);
            if (div3Content) $("#div3").html(div3Content);
        }

        function add() {
            const textContent = $("#textContent").val();
            if (textContent.trim() !== "") {
                const listItem = $("<li>").addClass("ui-state-default").html(`<span class="ui-icon ui-icon-arrowthick-2-n-s"></span>${textContent}`);
                $("#div1").append(listItem);
            }
            $("#textContent").val(""); // Clear the input field after adding
        }
        function remove() {
            localStorage.removeItem("div1");
            localStorage.removeItem("div2");
            localStorage.removeItem("div3");
            location.reload();
        }
    </script>
    <style>
    .sortable {
    border: 1px solid #7b7878;
    text-align: center;
    width: 160px;
    min-height: 170px;
    list-style-type: none;
    margin: 0;
    padding: 5px 0 0 0;
    float: left;
    margin-right: 10px;
  }
  .sortable li {
    margin: 0 5px 5px 5px;
    padding: 5px;
    font-size: 1.2em;
    width: 120px;
  }
    </style>
</head>
<body>  
        <div class="m-3 d-flex align-items-center justify-content-center">
            <input type="text" class="form-control w-50 me-3" id="textContent">
            <button type="submit" class="btn btn-secondary" onclick="add()">Add</button>
            <button type="button" class="btn btn-primary ms-3" onclick="saveChanges()">Save</button>
            <button type="button" class="btn btn-danger ms-3" onclick="remove()">Remove Content</button>
        </div>
   
    <div class="m-3 d-flex align-items-center justify-content-center">
        <ul class="sortable d-flex align-items-center flex-column" id="div1"></ul>
        <ul class="sortable d-flex align-items-center flex-column" id="div2"></ul>
        <ul class="sortable d-flex align-items-center flex-column" id="div3"></ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
