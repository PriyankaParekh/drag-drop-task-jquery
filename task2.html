<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task 2</title>
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
  <script>
    $(function () {
      // Function to save the state of the sortable list to localStorage
      function saveState() {
        var div2Items = $('#div2').html();
        localStorage.setItem('div2Items', div2Items);
      }

      // Function to load the state of the sortable list from localStorage
      function loadState() {
        var div2Items = localStorage.getItem('div2Items');
        if (div2Items) {
          $('#div2').html(div2Items);
        }
      }

      $(".sortable").sortable({
        revert: true,
        update: function (event, ui) {
          saveState();
        }
      });

      $(".draggable").draggable({
        connectToSortable: ".sortable",
        helper: "clone",
        revert: "invalid",
      });

      $("ul, li").disableSelection();

      // Load state on page load
      loadState();
    });
  </script>
  <style>
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      margin-bottom: 10px;
    }
    li {
      margin: 5px;
      padding: 5px;
      width: 150px;
    }
    .sortable {
      border: 1px solid #7b7878;
      text-align: center;
      width: 160px;
      min-height: 170px;
      list-style-type: none;
      margin: 0;
      padding: 5px 0 0 0;
      float: left;
      margin-right: 10px;
    }
    .sortable li {
      margin: 0 5px 5px 5px;
      padding: 5px;
      font-size: 1.2em;
      width: 120px;
    }
  </style>
</head>
<body>
  <div class="m-3 d-flex align-items-center justify-content-center">
    <ul class="d-flex align-items-center flex-column border me-3 sortable" id="div1">
      <li class="ui-state-default draggable">Item 1</li>
      <li class="ui-state-default draggable">Item 2</li>
      <li class="ui-state-default draggable">Item 3</li>
    </ul>
    <ul class="sortable d-flex align-items-center flex-column" id="div2"></ul>
  </div>
</body>
</html>
